[project]
name = "deadswitch-harness"
version = "0.1.0"
description = "VM1 agent harness: drives a scripted adversarial agent or an OpenAI-compatible model through the gateway only."
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "playwright>=1.47"]

[project.scripts]
deadswitch-harness = "deadswitch_harness.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
