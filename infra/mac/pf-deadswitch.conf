# pf anchor "deadswitch" — Mac-owned network gate for VM2.
# Lima (hostagent + vz + usernet) runs as user _deadswitch; every packet VM2 sends leaves the Mac as a
# socket owned by that user, so gating the user gates VM2. hostd swaps the anchor contents between
# open / sealed / cut (see hostd gate). This file is the SEALED rule set (also the boot default).
# Allowed: VM2 -> hostd (7001) on loopback only. Everything else from the Lima user is blocked and counted.
pass out quick proto tcp from any to 127.0.0.1 port { 7001 } user _deadswitch keep state
block out log quick all user _deadswitch label "deadswitch_bypass"
